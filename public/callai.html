<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discuss</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 14px 16px;
      text-align: center;
      border-bottom: 1px solid var(--tg-theme-hint-color, #e0e0e0);
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status {
      text-align: center;
      padding: 10px;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #999);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
      flex-shrink: 0;
    }
    .status.connecting .dot { background: #FF9800; animation: pulse 1.5s infinite; }
    .status.connected .dot { background: #4CAF50; animation: pulse 2s infinite; }
    .status.speaking .dot { background: #4CAF50; animation: pulse 0.6s infinite; }
    .status.processing .dot { background: #2196F3; animation: pulse 1s infinite; }
    .status.responding .dot { background: #2196F3; animation: pulse 1.2s infinite; }
    .status.ended .dot { background: #999; animation: none; }
    .status.error .dot { background: #f44336; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .transcript {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .msg.user {
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .controls {
      padding: 12px 16px 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .end-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .end-btn:active { opacity: 0.8; }
    .end-btn:disabled { opacity: 0.4; cursor: default; }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tg-theme-hint-color, #999);
      font-size: 14px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">Connecting...</h1>
  </div>
  <div class="status connecting" id="status">
    <span class="dot"></span>
    <span id="status-text">Initializing...</span>
  </div>
  <div class="transcript" id="transcript">
    <div class="empty-state" id="empty">Start speaking to discuss the conversation</div>
  </div>
  <div class="controls">
    <button class="end-btn" id="end-btn" onclick="endCall()">End Call</button>
  </div>
  <audio id="audio" autoplay></audio>

  <script>
    // --- Telegram WebApp ---
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // --- DOM ---
    var titleEl = document.getElementById('title');
    var statusEl = document.getElementById('status');
    var statusTextEl = document.getElementById('status-text');
    var transcriptEl = document.getElementById('transcript');
    var emptyEl = document.getElementById('empty');
    var audioEl = document.getElementById('audio');
    var endBtn = document.getElementById('end-btn');

    // --- State ---
    var pc = null;
    var dc = null;
    var currentAssistantEl = null;
    var hasMessages = false;

    var params = new URLSearchParams(window.location.search);
    var senderId = params.get('senderId');
    var channel = params.get('channel') || 'telegram';
    var upTo = parseInt(params.get('upTo') || '-1', 10);
    var API_BASE = window.location.origin;

    // --- UI ---
    function setStatus(cls, text) {
      statusEl.className = 'status ' + cls;
      statusTextEl.textContent = text;
    }

    function addMessage(role, text) {
      if (!hasMessages) {
        emptyEl.style.display = 'none';
        hasMessages = true;
      }
      var div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      transcriptEl.appendChild(div);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      return div;
    }

    // --- WebRTC ---
    async function start() {
      if (!senderId) {
        setStatus('error', 'No user specified');
        return;
      }

      setStatus('connecting', 'Getting session...');

      // Step 1: Get session token + instructions
      var session;
      try {
        var res = await fetch(API_BASE + '/api/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senderId: senderId, channel: channel, upTo: upTo }),
        });
        session = await res.json();
        if (!res.ok) throw new Error(session.error || 'Session failed');
      } catch (err) {
        setStatus('error', 'Session: ' + (err.message || err));
        return;
      }

      titleEl.textContent = 'Discuss (' + session.totalExchanges + ' exchanges)';
      setStatus('connecting', 'Connecting...');

      // Step 2: WebRTC
      try {
        pc = new RTCPeerConnection();

        pc.onconnectionstatechange = function() {
          if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
            setStatus('error', 'Connection lost');
          }
        };

        // Get microphone
        var stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          }
        });
        stream.getTracks().forEach(function(track) {
          pc.addTrack(track, stream);
        });

        // Remote audio
        pc.ontrack = function(e) {
          audioEl.srcObject = e.streams[0];
        };

        // Data channel
        dc = pc.createDataChannel('oai-events');
        dc.onopen = function() {
          setStatus('connected', 'Connected — speak now');
          dc.send(JSON.stringify({
            type: 'session.update',
            session: {
              type: 'realtime',
              instructions: session.instructions,
            },
          }));
        };
        dc.onclose = function() {
          setStatus('ended', 'Call ended');
        };
        dc.onmessage = function(e) {
          try {
            handleEvent(JSON.parse(e.data));
          } catch (err) {
            console.error('Failed to parse event:', err);
          }
        };

        // Create SDP offer
        var offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Exchange SDP via our server
        var sdpRes = await fetch(API_BASE + '/api/sdp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sdp: offer.sdp, token: session.token }),
        });
        var sdpData = await sdpRes.json();
        if (!sdpRes.ok) throw new Error(sdpData.error || 'SDP exchange failed');

        await pc.setRemoteDescription({ type: 'answer', sdp: sdpData.sdp });

      } catch (err) {
        if (pc) {
          pc.getSenders().forEach(function(sender) {
            if (sender.track) sender.track.stop();
          });
          pc.close();
          pc = null;
        }
        if (err.name === 'NotAllowedError' || err.name === 'NotFoundError') {
          setStatus('error', 'Microphone access denied. Please allow mic access and try again.');
        } else {
          setStatus('error', 'Failed: ' + err.message);
        }
        endBtn.disabled = true;
      }
    }

    // --- Data channel events ---
    function handleEvent(evt) {
      switch (evt.type) {
        case 'input_audio_buffer.speech_started':
          setStatus('speaking', 'Listening...');
          currentAssistantEl = null;
          break;

        case 'input_audio_buffer.speech_stopped':
          setStatus('processing', 'Thinking...');
          break;

        case 'conversation.item.input_audio_transcription.completed':
          if (evt.transcript && evt.transcript.trim()) {
            addMessage('user', evt.transcript.trim());
          }
          break;

        case 'response.audio_transcript.delta':
          if (!currentAssistantEl) {
            currentAssistantEl = addMessage('assistant', '');
            setStatus('responding', 'Speaking...');
          }
          currentAssistantEl.textContent += evt.delta;
          transcriptEl.scrollTop = transcriptEl.scrollHeight;
          break;

        case 'response.done':
          currentAssistantEl = null;
          setStatus('connected', 'Connected — speak now');
          break;

        case 'error':
          var msg = (evt.error && evt.error.message) ? evt.error.message : 'Unknown error';
          setStatus('error', msg);
          break;
      }
    }

    // --- End call ---
    function endCall() {
      if (dc) {
        dc.close();
        dc = null;
      }
      if (pc) {
        pc.getSenders().forEach(function(sender) {
          if (sender.track) sender.track.stop();
        });
        pc.close();
        pc = null;
      }
      setStatus('ended', 'Call ended');
      endBtn.disabled = true;
      if (tg) {
        setTimeout(function() { tg.close(); }, 1500);
      }
    }

    // --- Catch uncaught errors ---
    window.onerror = function(msg, url, line) {
      setStatus('error', msg + ' (line ' + line + ')');
      console.error('Uncaught error:', msg, url, line);
    };
    window.onunhandledrejection = function(e) {
      var msg = e.reason ? (e.reason.message || String(e.reason)) : 'Unknown async error';
      setStatus('error', 'Async: ' + msg);
      console.error('Unhandled rejection:', e.reason);
    };

    // --- Go ---
    start();
  </script>
</body>
</html>
